# Every harness promotion pull request (a harness2/ or h2/ branch) must carry measured evidence that
# passes, naming every file it changes: dev/harness2/evidence-check.mjs. It runs again whenever the
# branch or the description changes, so a promotion rewritten after it was measured fails. Any other
# pull request passes at once. The check runs the base branch's code, never the pull request's own.
name: Promotion evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence:
    name: Promotion evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A base from before this check existed has nothing to run; every base after it does.
      - run: |
          if [ -f dev/harness2/evidence-check.mjs ]; then
            node dev/harness2/evidence-check.mjs --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
          else
            echo "The base branch has no dev/harness2/evidence-check.mjs yet; nothing to check."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
