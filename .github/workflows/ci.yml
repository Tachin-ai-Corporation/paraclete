# Every push to main and every pull request runs the full test suite and builds the dashboard. It can
# also be dispatched: .github/workflows/harness-merge.yml dispatches it on main after a merge, because a
# merge made with a workflow's token starts no push run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm test

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix dashboard
      - run: npm run build:dashboard
