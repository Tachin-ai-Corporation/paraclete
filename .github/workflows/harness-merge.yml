# Merges the self-improvement harness's promotion pull requests (dev/harness2/merge.mjs), then the
# self-improvement loop's (dev/loop/merger.mjs, which passes dev/loop/guard.mjs and closes a loop pull
# request that cannot pass), every hour and when run by hand. The harness merger merges at most one
# per run, and none while CI on main's head failed or runs. Only open pull requests from this
# repository's `harness2/` and `h2/` branches against main are considered,
# and one is squash-merged only when CI passed on its head commit, its head contains main's head and
# GitHub can merge it cleanly, its evidence block passes judgeEvidence and names every file it
# changes, and those files are on the mutable surface (none removed, prompt additions linted,
# contracts changed only in tunable keys). A stale version in its title is moved on first, so main's
# head stays releasable. A refused one gets one comment saying why. After a merge, or when main's
# head has no CI, it dispatches ci.yml on main: a merge made with this workflow's token starts no push
# run, and dev/release.mjs needs CI to have passed on main.
#
# The job's name is dev/release.mjs HARNESS_MERGE_JOB: its check run on main's head is not CI, and no
# verdict counts it. The off switch: dev/harness2/PAUSED on main, or the repository variable
# PARACLETE_H2_PAUSED set to anything but '' or '0' (dev/harness2/pause.mjs). It runs main's own code
# and installs nothing.
name: Harness merge

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: read

concurrency:
  group: harness-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge passing promotions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge the promotions that pass
        env:
          GH_TOKEN: ${{ github.token }}
          PARACLETE_H2_PAUSED: ${{ vars.PARACLETE_H2_PAUSED }}
        run: node dev/harness2/merge.mjs --all --json
      # Runs whether or not the step above failed: one merger's trouble does not stop the other.
      - name: Merge the loop changes that pass
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PARACLETE_H2_PAUSED: ${{ vars.PARACLETE_H2_PAUSED }}
        run: node dev/loop/merger.mjs --json
